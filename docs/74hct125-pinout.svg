400">not connected</text><text x="24" y="420" font-size="12" fill="#1F2328" text-anchor="start" font-weight="400">Enable pins (1, 4, 10, 13) are active-low: tie them to GND or the outputs stay off.</text><text x="24" y="440" font-size="12" fill="#1F2328" text-anchor="start" font-weight="400">Unused inputs (9, 12) go to GND so they cannot float. Outputs 8 and 11 stay unconnected.</text></svg>